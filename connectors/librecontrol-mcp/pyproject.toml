[project]
name = "librecontrol-mcp"
version = "0.2.0"
description = "LibreControl universal MCP bridge — supervise any MCP-capable agent from your chat."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "cryptography>=43",
]

[project.scripts]
librecontrol-mcp = "librecontrol_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["librecontrol_mcp"]
